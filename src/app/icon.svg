<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background squircle with rich dark ocean gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  <rect width="512" height="512" rx="112" stroke="url(#borderGradient)" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Subtle background glow -->
  <circle cx="256" cy="180" r="140" fill="url(#sunGlow)" opacity="0.25"/>

  <!-- Golden Sun -->
  <circle cx="256" cy="160" r="56" fill="url(#sunGradient)"/>
  
  <!-- Sun Rays Accent Ring -->
  <circle cx="256" cy="160" r="76" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.7"/>

  <!-- Elegant Waves & Letter Z Monogram Crest -->
  <!-- Back Wave (Cyan) -->
  <path d="M96 340C140 310 200 310 256 340C312 370 372 370 416 340V390C416 410 400 426 380 426H132C112 426 96 410 96 390V340Z" fill="url(#waveBack)"/>

  <!-- Front Wave (Teal/White Gradient) -->
  <path d="M96 290C140 260 200 260 256 290C312 320 372 320 416 290C416 330 380 370 330 370H182C132 370 96 330 96 290Z" fill="url(#waveFront)"/>

  <!-- Crisp Modern Wave Line Accent -->
  <path d="M96 280C144 246 208 246 256 280C304 314 368 314 416 280" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunGradient" x1="200" y1="104" x2="312" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="waveBack" x1="96" y1="310" x2="416" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="96" y1="260" x2="416" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
</svg>
